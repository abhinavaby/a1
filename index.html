<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            text-align: center;
        }

        .card-container {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            transition: all 0.4s ease-in-out;
        }

        .input-style {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            text-align: center;
            transition: all 0.2s ease;
        }

        .input-style:focus {
            background-color: #ffffff;
            border-color: #4f46e5;
            outline: none;
            ring: 2px;
            ring-color: #c7d2fe;
        }

        .error-text {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .error-text.active {
            height: 1.25rem;
            opacity: 1;
            margin-bottom: 0.5rem;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="px-4 w-full flex justify-center">
        <!-- Login Form Section -->
        <div id="loginSection" class="card-container">
            <h1 class="text-3xl font-semibold text-gray-800 mb-2">Login Page</h1>
            <p class="text-gray-500 mb-8 text-sm">Please enter your credentials to continue</p>

            <form id="loginForm" novalidate>
                <div class="mb-4">
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Gmail Address" 
                        class="input-style w-full py-3 px-4 rounded-xl text-gray-700"
                    >
                    <div id="emailError" class="error-text">Please enter a valid @gmail.com</div>
                </div>

                <div class="mb-6">
                    <input 
                        type="tel" 
                        id="phone" 
                        placeholder="Phone Number" 
                        class="input-style w-full py-3 px-4 rounded-xl text-gray-700"
                    >
                    <div id="phoneError" class="error-text">Enter a valid phone (10+ digits)</div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-all shadow-sm active:transform active:scale-95"
                >
                    Submit
                </button>
            </form>
        </div>

        <!-- Redirection Section -->
        <div id="redirectSection" class="hidden text-center">
            <div class="loader mb-4"></div>
            <h2 class="text-2xl font-semibold text-gray-800">Redirecting...</h2>
            <p class="text-gray-500 mt-2">Validation successful. Please wait.</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginSection = document.getElementById('loginSection');
        const redirectSection = document.getElementById('redirectSection');
        
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        
        const emailError = document.getElementById('emailError');
        const phoneError = document.getElementById('phoneError');

        // Validation Patterns
        const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        const phoneRegex = /^\+?[0-9]{10,15}$/;

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const isEmailValid = gmailRegex.test(emailInput.value.trim().toLowerCase());
            const isPhoneValid = phoneRegex.test(phoneInput.value.trim());

            // Reset errors
            emailError.classList.remove('active');
            phoneError.classList.remove('active');

            if (!isEmailValid) {
                emailError.classList.add('active');
            }
            
            if (!isPhoneValid) {
                phoneError.classList.add('active');
            }

            if (isEmailValid && isPhoneValid) {
                // Animate transition
                loginSection.classList.add('fade-out');
                
                setTimeout(() => {
                    loginSection.classList.add('hidden');
                    redirectSection.classList.remove('hidden');
                    
                    // Final Redirection
                    setTimeout(() => {
                        window.location.href = "https://abhinavaby.github.io/Abhinav-Aby-portfolio/";
                    }, 2000);
                }, 400);
            }
        });

        // Clear errors on input
        [emailInput, phoneInput].forEach(input => {
            input.addEventListener('input', () => {
                emailError.classList.remove('active');
                phoneError.classList.remove('active');
            });
        });
    </script>
</body>
</html>
